<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="mTalular funny airedale-like knight logo">
  <defs>
    <style>
      .ink{fill:#101010}
      .paper{fill:#ffffff}
      .stroke{fill:none;stroke:#101010;stroke-linecap:round;stroke-linejoin:round}
      .word{font-family:'Avenir Next','Trebuchet MS','PingFang SC',sans-serif;fill:#101010}
    </style>
  </defs>

  <g transform="translate(36,30)">
    <rect x="0" y="0" width="362" height="362" rx="54" class="ink"/>

    <!-- Knight body with Airedale-ish beard/muzzle humor -->
    <path class="paper" d="M84 286
      C87 244, 104 214, 136 195
      C118 166, 118 135, 140 112
      C161 90, 192 82, 224 92
      C258 104, 280 132, 286 168
      C288 180, 286 192, 280 203
      C271 195, 260 190, 248 190
      C230 190, 214 202, 206 220
      C198 239, 184 254, 166 263
      C150 271, 146 278, 145 286 Z"/>

    <!-- muzzle/beard (funny terrier vibe) -->
    <ellipse cx="232" cy="184" rx="34" ry="24" class="paper"/>
    <path class="stroke" d="M210 188 C224 199, 240 199, 254 188" style="stroke:#101010;stroke-width:7"/>
    <circle cx="244" cy="172" r="5" class="ink"/>

    <!-- eyebrow + eye -->
    <path class="stroke" d="M214 144 C226 136, 240 136, 252 142" style="stroke:#101010;stroke-width:6"/>
    <circle cx="236" cy="149" r="6" class="ink"/>

    <!-- ear pair for knight silhouette -->
    <path class="ink" d="M154 112 L168 78 L186 110 Z"/>
    <path class="ink" d="M184 108 L204 78 L210 116 Z"/>

    <!-- wrench mane gag -->
    <g transform="translate(156,138) rotate(-20)">
      <path class="ink" d="M0 0
        C18 -10, 42 -9, 59 5
        C43 10, 30 23, 27 40
        C24 58, 31 74, 45 83
        C28 88, 9 83, -4 71
        C-24 52, -27 24, -10 3 Z"/>
      <circle cx="36" cy="49" r="8" class="paper"/>
      <rect x="31" y="51" width="10" height="30" rx="5" class="paper"/>
    </g>

    <!-- comic whiskers -->
    <path class="stroke" d="M258 184 L274 178" style="stroke:#101010;stroke-width:4"/>
    <path class="stroke" d="M258 192 L276 192" style="stroke:#101010;stroke-width:4"/>
    <path class="stroke" d="M258 200 L274 206" style="stroke:#101010;stroke-width:4"/>

    <!-- base -->
    <rect x="68" y="286" width="226" height="24" rx="10" class="paper"/>
    <rect x="54" y="310" width="254" height="30" rx="12" class="paper"/>
  </g>

  <g transform="translate(448,112)">
    <text class="word" x="0" y="130" font-size="138" font-weight="800" letter-spacing="1">mTalular</text>
    <path d="M2 161 H548" class="stroke" style="stroke:#101010;stroke-width:7"/>
    <text class="word" x="2" y="206" font-size="26" letter-spacing="3">A KNIGHT WITH A DOGGO ATTITUDE</text>
  </g>
</svg>
